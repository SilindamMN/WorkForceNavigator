<app-basic-table-three
  title="Users"
  [name]="'Users'"
  [columns]="columns"
  [data]="users"
  [canAdd]="isAdmin"
  [canEdit]="isAdmin"
  [canDelete]="isAdmin"
  (add)="createUser()"
  (edit)="editUser($event)"
  (delete)="deleteUser($event)"
  (save)="handleSave($event)"
></app-basic-table-three>
