<div
  class="rounded-2xl border border-gray-200
         bg-white dark:border-gray-800
         dark:bg-white/[0.03]"
>

  <app-basic-table-three
    [data]="teams"
    [columns]="columns"
    [itemsPerPage]="10"
    title="Teams"
    entity="Team"
    (add)="createTeam()"
    (edit)="editTeam($event)"
    (delete)="deleteTeam($event)"
    (save)="handleSave($event)">
  </app-basic-table-three>

</div>
