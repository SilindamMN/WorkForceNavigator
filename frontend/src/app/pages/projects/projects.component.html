<div
  class="rounded-2xl border border-gray-200
         bg-white dark:border-gray-800
         dark:bg-white/[0.03]"
>

  <app-basic-table-three
    [data]="projects"
    [columns]="columns"
    [itemsPerPage]="10"
    title="Projects"
    entity="Project"
    (add)="createProject()"
    (edit)="editProject($event)"
    (delete)="deleteProject($event)"
    (save)="handleSave($event)">
  </app-basic-table-three>

</div>
